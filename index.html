<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Garage 3D</title>
    <meta name="description" content="Modellini 3D di auto sportive reali: montali, guidali, guardali in studio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div id="curtain"></div>

    <header id="info">
      <div class="overline">Garage</div>
      <h1 id="car-name"></h1>
      <div class="car-meta">
        <span id="car-year"></span>
        <div class="stepper glass" role="group" aria-label="Cambia auto">
          <button class="icon-btn" id="prev-car" type="button" aria-label="Auto precedente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" /></svg>
          </button>
          <span class="count" id="car-count"></span>
          <button class="icon-btn" id="next-car" type="button" aria-label="Auto successiva">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" /></svg>
          </button>
        </div>
      </div>
    </header>

    <button class="glass round" id="info-btn" type="button" aria-label="Crediti" aria-expanded="false" aria-controls="credits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5M12 7.6v.1" /></svg>
    </button>
    <section class="glass card" id="credits" aria-label="Crediti" hidden></section>

    <div class="glass" id="palette" hidden></div>

    <div class="glass" id="hint" aria-live="polite"></div>

    <nav class="glass" id="modes" aria-label="Modalità">
      <span class="mode-indicator" aria-hidden="true"></span>
      <button class="mode-btn" data-mode="kit" type="button">Kit</button>
      <button class="mode-btn" data-mode="drive" type="button">Drive</button>
      <button class="mode-btn" data-mode="studio" type="button">Studio</button>
    </nav>

    <div id="joystick">
      <div class="joystick-base"><div class="joystick-knob"></div></div>
    </div>

    <div id="loading">
      <div class="loading-name"></div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
      <div class="loading-pct"></div>
    </div>
    <div id="toast" role="status"></div>
    <div id="fatal" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
